# ONE Nginx edge configuration
# - Preserves Supdance Pro/middleware.js 307/308 redirects and next.config.mjs rewrite
# - Avoids duplicate X-Frame-Options between Nginx and one-backend
# - Disables buffering only on SSE /api/generations/events

map $uri $one_frame_options {
    default "DENY";
    ~^/embed-auth(?:/.*)?$ "";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Preserve exact next.config.mjs rewrite
    rewrite ^/ai-tool/work-detail/([^/]+)$ /community/$1 last;

    # Exact middleware.js 308 redirects: /canvas, /canvas/*, /:locale/canvas*
    location ~ "^/(?:[a-zA-Z]{2}(?:-[a-zA-Z]{2})?/)?(canvas(?:/.*)?)$" {
        return 308 https://canvas.supdance.com/$1$is_args$args;
    }

    # Exact middleware.js 307 redirects for legacy /:locale?/(image|video|audio|music)/?
    location ~* ^/(image|video|audio|music)/?$ {
        set $tab $1;
        if ($tab ~* ^music$) {
            set $tab "audio";
        }
        set $sep "?";
        if ($args != "") {
            set $sep "?$args&";
        }
        return 307 /studio${sep}tab=$tab;
    }
    location ~ ^/(zh|ja-JP|ko-KR|zh-TW|es)/(image|video|audio|music)/?$ {
        set $loc $1;
        set $tab $2;
        if ($tab ~* ^music$) {
            set $tab "audio";
        }
        set $sep "?";
        if ($args != "") {
            set $sep "?$args&";
        }
        return 307 /$loc/studio${sep}tab=$tab;
    }

    location = /en {
        return 308 /$is_args$args;
    }
    location ~ ^/en/(.*)$ {
        return 308 /$1$is_args$args;
    }

    location = /zh {
        return 308 /$is_args$args;
    }
    location = /zh/ {
        return 308 /$is_args$args;
    }

    # Exact-case canonical non-English prefixes pass straight through to SPA fallback (prevents /zh-TW redirect loop)
    location ~ ^/(?:zh-TW|ja-JP|ko-KR)(?:/.*)?$ {
        add_header X-Frame-Options $one_frame_options always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri /index.html;
    }

    # Alias locale canonicalization (308)
    location ~* ^/zh-cn(?:/(.*))?$ {
        set $rest $1;
        if ($rest = "") {
            return 308 /zh$is_args$args;
        }
        return 308 /zh/$rest$is_args$args;
    }
    location ~* ^/ja(?:/(.*))?$ {
        set $rest $1;
        if ($rest = "") {
            return 308 /ja-JP$is_args$args;
        }
        return 308 /ja-JP/$rest$is_args$args;
    }
    location ~* ^/ko(?:/(.*))?$ {
        set $rest $1;
        if ($rest = "") {
            return 308 /ko-KR$is_args$args;
        }
        return 308 /ko-KR/$rest$is_args$args;
    }
    location ~* ^/zh-tw(?:/(.*))?$ {
        set $rest $1;
        if ($rest = "") {
            return 308 /zh-TW$is_args$args;
        }
        return 308 /zh-TW/$rest$is_args$args;
    }
    location ~* ^/(?:es-es|es-la|es-mx|es-ar)(?:/(.*))?$ {
        set $rest $1;
        if ($rest = "") {
            return 308 /es$is_args$args;
        }
        return 308 /es/$rest$is_args$args;
    }

    # SSE generation stream: disable proxy buffering, cache, and gzip strictly on this path
    location = /api/generations/events {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
    }

    # Provider reference URLs carry a short-lived signature.
    location ^~ /api/generations/references/ {
        access_log off;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Go modular monolith API proxy (one-backend sets sole X-Frame-Options header)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        location = /api/feedback {
            client_max_body_size 31m;
        }
    }

    # Non-/api/ backend handlers (sitemap + OAuth initiation/callbacks; one-backend sets sole X-Frame-Options header)
    location = /sitemap.xml {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /auth/tiktok {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /auth/tiktok/callback {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/auth/[^/]+/callback$ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # `/assets` SPA product route must not collide with Vite's `dist/assets/` static directory
    location = /assets {
        add_header X-Frame-Options $one_frame_options always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files /index.html =404;
    }

    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ^~ /uploads/branding/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /branding/videos/ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA fallback (single X-Frame-Options applied here, omitted on /embed-auth)
    location / {
        add_header X-Frame-Options $one_frame_options always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri /index.html;
    }
}
