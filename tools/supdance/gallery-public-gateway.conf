# After deploying the protected backend and web image, replace the emergency
# include with this gateway. The application remains the only policy authority.
location = /inspirations {
    proxy_pass http://127.0.0.1:3240;
    proxy_set_header Host $host;
    proxy_cache off;
}
location ^~ /inspirations/ {
    proxy_pass http://127.0.0.1:3240;
    proxy_set_header Host $host;
    proxy_cache off;
}
location ^~ /inspiration-thumbs/ {
    proxy_pass http://127.0.0.1:3240;
    proxy_set_header Host $host;
    proxy_cache off;
}
location ^~ /api/public/inspirations/ {
    proxy_pass http://127.0.0.1:3240;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache off;
}
