# Emergency and rollback guard. All public visitors receive the same response.
# Keep this include enabled before rolling back to a pre-isolation application.
location = /inspirations {
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, noarchive" always;
    return 410;
}
location ^~ /inspirations/ {
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, noarchive" always;
    return 410;
}
location ^~ /inspiration-thumbs/ {
    add_header Cache-Control "no-store" always;
    return 410;
}
location ^~ /api/public/inspirations/ {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 410 '{"code":410,"data":null,"reason":"inspiration_quarantined","msg":"Inspiration gallery is not publicly available"}';
}
