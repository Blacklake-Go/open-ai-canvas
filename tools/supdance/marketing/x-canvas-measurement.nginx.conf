# Include from the www.supdance.com TLS server until the campaign UTM is in the deployed app bundle.
location = /supdance-x-measurement.html {
    alias /opt/supdance-x-canvas-attribution/supdance-x-measurement.html;
    default_type text/html;
    access_log off;
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}
