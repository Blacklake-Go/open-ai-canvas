<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="referrer" content="no-referrer" />
        <title>SupDance measurement</title>
    </head>
    <body>
        <script>
            // A dedicated document keeps private workspace URLs/titles out of automatic
            // vendor metadata. Only the consented parent can initialize or send a purchase.
            (() => {
                if (location.hostname !== "www.supdance.com" || parent === window) return;
                let isSales = new URLSearchParams(location.search).get("source") === "sales";
                // Older cached app bundles do not pass source=sales for the Canvas campaign.
                if (!isSales) {
                    try {
                        const landing = new URL(parent.location.href);
                        isSales =
                            landing.origin === location.origin &&
                            landing.pathname === "/" &&
                            landing.searchParams.get("utm_source") === "x" &&
                            landing.searchParams.get("utm_medium") === "paid_social" &&
                            landing.searchParams.get("utm_campaign") === "canvas_zh_market_202611" &&
                            parent.localStorage.getItem("supdance:marketing-consent:v1") === "accepted";
                    } catch {
                        // A cross-origin parent cannot supply landing attribution.
                    }
                }
                const pixelId = isSales ? "rih9p" : "rinhf";
                const purchaseEventId = isSales ? "tw-rih9p-rk5ya" : "tw-rinhf-rinl3";
                let ready = false;
                const reply = (type) => parent.postMessage({ source: "supdance-x-pixel", type }, location.origin);
                window.addEventListener("message", (event) => {
                    if (event.origin !== location.origin || event.source !== parent || event.data?.source !== "supdance-marketing") return;
                    if (event.data.type === "purchase" && ready) {
                        const value = event.data.value;
                        const currency = event.data.currency;
                        const conversionId = event.data.conversion_id;
                        if (!Number.isFinite(value) || value <= 0 || !["CNY", "USD"].includes(currency) || !/^[a-f0-9]{64}$/.test(conversionId)) return;
                        twq("event", purchaseEventId, { value, currency, conversion_id: conversionId });
                    }
                });
                const pixel = (window.twq = function () {
                    pixel.exe ? pixel.exe.apply(pixel, arguments) : pixel.queue.push(arguments);
                });
                pixel.version = "1.1";
                pixel.queue = [];
                const script = document.createElement("script");
                script.src = "https://static.ads-twitter.com/uwt.js";
                script.async = true;
                script.referrerPolicy = "no-referrer";
                script.onload = () => {
                    pixel("config", pixelId);
                    ready = true;
                    reply("ready");
                };
                script.onerror = () => reply("error");
                document.head.append(script);
            })();
        </script>
    </body>
</html>
