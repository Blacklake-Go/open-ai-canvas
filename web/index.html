<!doctype html>
<html lang="en" translate="no" class="font-sans">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>SupDance — AI Creative Workspace for Video &amp; Story Generation</title>
        <meta name="description" content="SupDance is an all-in-one AI creative workspace for video, image, and multimedia storytelling. Create, iterate, and produce cinematic content with generative AI." />
        <meta name="keywords" content="SupDance, AI video generator, AI filmmaking, generative AI, AI canvas, text to video, image to video, creative workspace, AI studio, storytelling" />
        <meta name="author" content="SupDance" />
        <meta name="robots" content="index, follow" />
        <link rel="canonical" href="https://www.supdance.com/" />

        <!-- Open Graph / Facebook -->
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://www.supdance.com/" />
        <meta property="og:title" content="SupDance — AI Creative Workspace for Video &amp; Story Generation" />
        <meta property="og:description" content="SupDance is an all-in-one AI creative workspace for video, image, and multimedia storytelling. Create, iterate, and produce cinematic content with generative AI." />
        <meta property="og:site_name" content="SupDance" />
        <meta property="og:image" content="https://www.supdance.com/logo.svg" />

        <!-- Twitter Card -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="SupDance — AI Creative Workspace for Video &amp; Story Generation" />
        <meta name="twitter:description" content="SupDance is an all-in-one AI creative workspace for video, image, and multimedia storytelling. Create, iterate, and produce cinematic content with generative AI." />
        <meta name="twitter:image" content="https://www.supdance.com/logo.svg" />
        <!-- 不写内置品牌资源：首屏必须品牌中性，favicon 由 use-appearance-store 解析出外观后写入。
             空 data URL 只是为了不让浏览器去请求 /favicon.ico（那会是一条 404）。 -->
        <link rel="icon" href="data:," />
        <style>
            /* Fix layer order before production chunks can register utilities ahead of base. */
            @layer theme, base, components, utilities;

            html,
            body {
                margin: 0;
                background: #ffffff;
            }
            /* 与 globals.css 的 .dark --background 一致；暗色主题下切页或首屏不透出白底。 */
            html.dark,
            html.dark body {
                background: #0f0f11;
            }
            #boot-recovery {
                position: fixed;
                inset-inline: 24px;
                top: calc(50% + 32px);
                text-align: center;
                font: 16px/1.6 sans-serif;
                color: #171717;
            }
            #boot-recovery button {
                padding: 8px 16px;
                border: 1px solid currentColor;
                border-radius: 8px;
                background: transparent;
                color: inherit;
                font: inherit;
                cursor: pointer;
            }
            html.dark #boot-recovery {
                color: #f5f5f5;
            }
            #root:empty {
                min-height: 100vh;
            }
            /* 启动信号是 FullScreenLoader 里 .loading-signal 的镜像：同尺寸、同位置、同节奏，
               并按同一 performance.now() 时钟对齐相位（见 body 内脚本），React 接管时扫光原地继续。
               只用中性墨色，首屏保持品牌中性；改动时与 globals.css 的 .loading-signal 一起改。 */
            #root:empty::before {
                --boot-signal-ink: rgba(23, 23, 23, 0.8);
                content: "";
                position: fixed;
                left: 50%;
                top: 50%;
                width: 112px;
                height: 2px;
                margin: -1px 0 0 -56px;
                border-radius: 999px;
                background:
                    linear-gradient(90deg, transparent, var(--boot-signal-ink) 25%, var(--boot-signal-ink) 75%, transparent) -66.667% 0 / 40% 100% no-repeat,
                    rgba(16, 16, 20, 0.1);
                animation: boot-signal-sweep 1500ms cubic-bezier(0.35, 0.05, 0.65, 0.95) calc(-1 * var(--boot-signal-clock, 0ms)) infinite;
            }
            html.dark #root:empty::before {
                --boot-signal-ink: rgba(245, 245, 245, 0.8);
                background-color: rgba(244, 244, 246, 0.1);
            }
            @keyframes boot-signal-sweep {
                from {
                    background-position: -66.667% 0;
                }
                to {
                    background-position: 166.667% 0;
                }
            }
            @keyframes boot-signal-breathe {
                0%,
                100% {
                    opacity: 0.35;
                }
                50% {
                    opacity: 1;
                }
            }
            @media (prefers-reduced-motion: reduce) {
                #root:empty::before {
                    background-position: 50% 0;
                    animation-name: boot-signal-breathe;
                    animation-timing-function: ease-in-out;
                }
            }
        </style>
        <script>
            try {
                var s = JSON.parse(localStorage.getItem("yingce:theme_store") || "{}");
                var t = s.state && s.state.theme === "dark" ? "dark" : "light";
                document.documentElement.classList.toggle("dark", t === "dark");
                document.documentElement.style.colorScheme = t;
            } catch (e) {}
        </script>
    </head>
    <body class="bg-background text-foreground antialiased">
        <div id="root"></div>
        <section id="boot-recovery" role="status" aria-live="polite">
            <p>Opening your workspace…</p>
            <button type="button" hidden>Reload</button>
        </section>
        <script>
            // 放在 #root 之后：外链样式加载完、首帧绘制前才执行，启动信号从这一刻对齐 performance.now()。
            (() => {
                const bootRoot = document.getElementById("root");
                bootRoot.style.setProperty("--boot-signal-clock", performance.now() + "ms");
                const notice = document.getElementById("boot-recovery");
                const message = notice.querySelector("p");
                const retry = notice.querySelector("button");
                const entrySelector = 'script[type="module"][src]';
                let failed = false;
                let slow = false;
                let checkedVersion = false;

                // Recovery also runs when the application and its language bundles fail to load.
                const recoveryCopy = {
                    "en-US": ["Opening your workspace…", "Loading is taking longer than usual…", "Startup files could not be loaded. Try again. Your cached canvases will be kept.", "Check your internet connection.", "Reload"],
                    "zh-CN": ["正在打开创作空间…", "加载较慢，仍在继续…", "部分启动资源未能加载，请重试。浏览器中的画布缓存会保留。", "请检查网络连接。", "重新加载"],
                    "zh-TW": ["正在開啟創作空間…", "載入時間較長，請稍候…", "部分啟動資源無法載入，請再試一次。瀏覽器中的畫布快取會保留。", "請檢查網路連線。", "重新載入"],
                    "fr-FR": [
                        "Ouverture de votre espace de travail…",
                        "Le chargement prend plus de temps que prévu…",
                        "Certains fichiers de démarrage sont indisponibles. Réessayez. Vos canevas en cache seront conservés.",
                        "Vérifiez votre connexion Internet.",
                        "Recharger",
                    ],
                    "de-DE": [
                        "Arbeitsbereich wird geöffnet…",
                        "Das Laden dauert länger als gewöhnlich…",
                        "Einige Startdateien konnten nicht geladen werden. Versuchen Sie es erneut. Ihre lokal gespeicherten Leinwände bleiben erhalten.",
                        "Überprüfen Sie Ihre Internetverbindung.",
                        "Neu laden",
                    ],
                    "es-ES": [
                        "Abriendo tu espacio de trabajo…",
                        "La carga está tardando más de lo habitual…",
                        "No se pudieron cargar algunos archivos de inicio. Inténtalo de nuevo. Se conservarán los lienzos en caché.",
                        "Comprueba tu conexión a Internet.",
                        "Volver a cargar",
                    ],
                    "ja-JP": [
                        "ワークスペースを開いています…",
                        "読み込みに時間がかかっています…",
                        "起動に必要なファイルの一部が読み込めませんでした。もう一度お試しください。保存済みのキャンバスのキャッシュは保持されます。",
                        "インターネット接続を確認してください。",
                        "再読み込み",
                    ],
                    "ko-KR": ["작업 공간을 여는 중…", "평소보다 로딩이 오래 걸리고 있습니다…", "일부 시작 파일을 불러올 수 없습니다. 다시 시도해 주세요. 브라우저에 캐시된 캔버스는 유지됩니다.", "인터넷 연결을 확인해 주세요.", "새로고침"],
                };
                let locale = "en-US";
                try {
                    const saved = localStorage.getItem("yingce:locale");
                    const preferred = saved ? JSON.parse(saved)?.state?.locale : localStorage.getItem("supdance:i18n:locale");
                    if (Object.hasOwn(recoveryCopy, preferred)) locale = preferred;
                } catch {}
                const [loadingMessage, slowMessage, failureMessage, offlineMessage, reloadLabel] = recoveryCopy[locale];
                notice.lang = locale;
                retry.textContent = reloadLabel;

                function reload() {
                    const url = new URL(location.href);
                    url.searchParams.set("__chunk_recovery", String(Date.now()));
                    location.replace(url.toString());
                }

                function updateMessage() {
                    const offline = navigator.onLine === false;
                    message.textContent = offline ? offlineMessage : failed ? failureMessage : slow ? slowMessage : loadingMessage;
                    retry.hidden = !offline && !failed;
                }

                async function showFailure(status) {
                    if (bootRoot.childNodes.length) return;
                    failed = true;
                    updateMessage();
                    if (checkedVersion || (status !== 404 && status !== 410) || new URL(location.href).searchParams.has("__chunk_recovery")) return;
                    checkedVersion = true;
                    try {
                        const current = document.querySelector(entrySelector);
                        if (!current) return;
                        const response = await fetch(location.href, { cache: "no-store", signal: AbortSignal.timeout(5000) });
                        if (!response.ok) return;
                        const latest = new DOMParser().parseFromString(await response.text(), "text/html").querySelector(entrySelector);
                        if (!latest) return;
                        const entry = new URL(latest.getAttribute("src"), response.url || location.href);
                        if (!bootRoot.childNodes.length && entry.origin === new URL(location.href).origin && /^\/assets\/[^/]+\.js$/.test(entry.pathname) && entry.href !== current.src) reload();
                    } catch {
                        // 版本检查失败时保留手动恢复入口。
                    }
                }

                function onStartupFailure(event) {
                    void showFailure(event.detail.status);
                }

                async function onScriptFailure(event) {
                    const entry = document.querySelector(entrySelector);
                    if (!entry || event.target !== entry || bootRoot.childNodes.length) return;
                    let status;
                    try {
                        const response = await fetch(entry.src, { method: "HEAD", cache: "no-store", signal: AbortSignal.timeout(5000) });
                        status = response.status;
                    } catch {
                        // 原生模块报错可能来自下游依赖，只有确认缺失才检查版本。
                    }
                    await showFailure(status);
                }

                retry.onclick = reload;
                addEventListener("online", updateMessage);
                addEventListener("offline", updateMessage);
                addEventListener("starai:startup-load-failure", onStartupFailure);
                addEventListener("error", onScriptFailure, true);
                updateMessage();
                const bootTimer = setTimeout(() => {
                    slow = true;
                    updateMessage();
                }, 20000);
                const bootObserver = new MutationObserver(() => {
                    if (!bootRoot.childNodes.length) return;
                    clearTimeout(bootTimer);
                    bootObserver.disconnect();
                    removeEventListener("online", updateMessage);
                    removeEventListener("offline", updateMessage);
                    removeEventListener("starai:startup-load-failure", onStartupFailure);
                    removeEventListener("error", onScriptFailure, true);
                    notice.remove();
                });
                bootObserver.observe(bootRoot, { childList: true });
            })();
        </script>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
